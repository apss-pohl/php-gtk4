<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  The private session bus tests/run.sh starts with dbus-run-session. Deliberately without a
  <servicedir>: the stock session config would let GTK's portal lookups activate the whole
  xdg-desktop-portal stack (keyring, document portal, ...) on the developer's machine, half a
  minute of services nothing here talks to. With no services to activate, a name that is not
  owned is simply not owned.
-->
<busconfig>
  <type>session</type>
  <keep_umask/>
  <listen>unix:tmpdir=/tmp</listen>
  <policy context="default">
    <allow send_destination="*" eavesdrop="true"/>
    <allow eavesdrop="true"/>
    <allow own="*"/>
  </policy>
</busconfig>
