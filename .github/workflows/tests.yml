name: Build & tests

# The PR run is the gate: release.yml re-validates main on every merge (its `verify` job
# runs ./ci.sh in full), so a `push: [main]` trigger here only paid for the same commit twice.
on:
  workflow_dispatch:
  pull_request:

# Read-only token: these workflows only check out and build.
permissions:
  contents: read

# Superseded runs of the same ref are cancelled (a PR push while the previous one runs).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which thread models this push has to be run against. ZTS exists here to catch per-request
  # state put in a plain static instead of the module globals, so it is worth its four jobs when
  # something under src/core (or the header that declares the globals) moved, and not otherwise.
  # Anything that is not a pull request has no base to compare against and gets both.
  # `PHP 8.4 ZTS` / `PHP 8.5 ZTS` are deliberately not required status checks, which is what
  # makes leaving the cells out safe - see docs/RELEASING.md "Gating".
  changes:
    name: What this push touches
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      thread-models: ${{ steps.pick.outputs.thread-models }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: pick
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ -z "$BASE" ]]; then
            echo 'thread-models=["nts","ts"]' >> "$GITHUB_OUTPUT"
            echo "not a pull request: both thread models" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if git diff --name-only "$BASE" HEAD \
             | grep -qE '^(src/core/|src/php_gtk4\.h$|src/classes\.h$|config\.m4$)'; then
            echo 'thread-models=["nts","ts"]' >> "$GITHUB_OUTPUT"
            echo "core changed: NTS and ZTS" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'thread-models=["nts"]' >> "$GITHUB_OUTPUT"
            echo "no core change: NTS only (ZTS runs on merge and before a release)" >> "$GITHUB_STEP_SUMMARY"
          fi

  php-tests:
    name: PHP ${{ matrix.php }}${{ matrix.ts == 'ts' && ' ZTS' || '' }}
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Everything we claim to support (8.4+), on the GTK floor (24.04 = GTK 4.14).
        php: ['8.4', '8.5']
        ts: ${{ fromJSON(needs.changes.outputs.thread-models) }}
    env:
      phpts: ${{ matrix.ts }}
      # tests/run.sh, bin/php-gtk4 and ci.sh default to the php8.4 binaries; setup-php provides plain names.
      PHP: php
      PHP_CONFIG: php-config
      PHPIZE: phpize
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, mbstring, tokenizer, xml, xmlwriter
          tools: composer
          coverage: none

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgtk-4-dev glib-networking xvfb libxtst6 build-essential

      - name: Build extension (phpize)
        run: ./ci.sh --only=build

      - name: Extension loads
        run: ./ci.sh --only=load

      - name: Cache Composer packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: composer-php${{ matrix.php }}-${{ hashFiles('composer.lock') }}

      - name: Install PHPUnit
        run: composer install --no-interaction --no-progress --prefer-dist

      # xvfb-run + bin/php-gtk4 (gtk3 filter, keeps PHPUnit's extensions) + phpunit
      - name: Show versions
        run: |
          php -v | head -1
          pkg-config --modversion gtk4

      # --log-events-text is written as the run goes, so a crash (PHPUnit dies with the
      # process and writes no JUnit file) still names the test that was running.
      - name: Run PHPUnit
        run: ./ci.sh --only=test -- --log-junit phpunit-junit.xml --log-events-text phpunit-events.txt --display-warnings

      - name: Name the last test on a crash
        if: failure()
        run: tail -20 phpunit-events.txt || true

      - name: Upload PHPUnit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phpunit-junit-php${{ matrix.php }}-${{ matrix.ts }}
          path: |
            phpunit-junit.xml
            phpunit-events.txt
          if-no-files-found: ignore

      # php-src run-tests.php: the process-level assertions PHPUnit cannot make
      # (g_critical on stderr, uncaught fatals, RSHUTDOWN output, --INI--/--ENV--).
      - name: Run run-tests.php (tests/phpt)
        run: ./ci.sh --only=phpt

      - name: Upload failing phpt output
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phpt-failures-php${{ matrix.php }}-${{ matrix.ts }}
          path: |
            tests/phpt/*.out
            tests/phpt/*.diff
            tests/phpt/*.log
          if-no-files-found: ignore

  sanitizers:
    name: Valgrind / ASan / UBSan / LSan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PHP: php
      PHP_CONFIG: php-config
      PHPIZE: phpize
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: dom, mbstring, tokenizer, xml, xmlwriter
          tools: composer
          coverage: none

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libgtk-4-dev glib-networking xvfb libxtst6 build-essential valgrind

      - name: Install PHPUnit
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Build extension (phpize)
        run: ./ci.sh --only=build

      - name: Run valgrind stage
        run: ./ci.sh --only=valgrind

      # Instrumented gtk4-asan.so: stress script with LeakSanitizer (only our
      # module in that process), then the PHPUnit suite for memory errors.
      - name: Run sanitizer stage
        run: ./ci.sh --only=asan

  # --enable-gtk4-webkit is analysed by cpp-lint.yml; this leg builds it, loads it and runs the
  # suite against it - the only run in which the WebKit* / JSC* classes exist (the matrix above
  # builds without WebKit and skips their tests through tests/Features.php).
  webkit:
    name: WebKitGTK build & tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PHP: php
      PHP_CONFIG: php-config
      PHPIZE: phpize
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: dom, mbstring, tokenizer, xml, xmlwriter
          tools: composer
          coverage: none

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgtk-4-dev libwebkitgtk-6.0-dev glib-networking xvfb libxtst6 build-essential

      - name: Build and load with WebKit
        run: GTK4_CONFIGURE_ARGS=--enable-gtk4-webkit ./ci.sh --only=build,load

      - name: Cache Composer packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: composer-php8.4-${{ hashFiles('composer.lock') }}

      - name: Install PHPUnit
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run PHPUnit
        run: ./ci.sh --only=test -- --log-junit phpunit-junit.xml --log-events-text phpunit-events.txt --display-warnings

      - name: Name the last test on a crash
        if: failure()
        run: tail -20 phpunit-events.txt || true

      - name: Upload PHPUnit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phpunit-junit-php8.4-webkit
          path: |
            phpunit-junit.xml
            phpunit-events.txt
          if-no-files-found: ignore
