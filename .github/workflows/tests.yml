name: Build & tests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

# Read-only token: these workflows only check out and build.
permissions:
  contents: read

# Superseded runs of the same ref are cancelled (a PR push while the previous one runs).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-tests:
    name: PHP ${{ matrix.php }}${{ matrix.ts == 'ts' && ' ZTS' || '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Everything we claim to support (8.4+), on the GTK floor (24.04 = GTK 4.14).
        php: ['8.4', '8.5']
        # Both thread models: per-request state lives in module globals (src/core/globals.h);
        # the suite is single-threaded, so ZTS checks the build and the GINIT/GSHUTDOWN path.
        ts: [nts, ts]
    env:
      phpts: ${{ matrix.ts }}
      # tests/run.sh, bin/php-gtk4 and ci.sh default to the php8.4 binaries; setup-php provides plain names.
      PHP: php
      PHP_CONFIG: php-config
      PHPIZE: phpize
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, mbstring, tokenizer, xml, xmlwriter
          tools: composer
          coverage: none

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgtk-4-dev xvfb libxtst6 build-essential

      # --enable-gtk4-testing: the Gtk::testing_* hooks (RethrowModeTest's nested-loop cases)
      # run on every matrix leg, not only under the sanitizers; releases build without it.
      - name: Build extension (phpize)
        run: GTK4_CONFIGURE_ARGS=--enable-gtk4-testing ./ci.sh --only=build

      - name: Extension loads
        run: ./ci.sh --only=load

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-php${{ matrix.php }}-${{ hashFiles('composer.lock') }}

      - name: Install PHPUnit
        run: composer install --no-interaction --no-progress --prefer-dist

      # xvfb-run + bin/php-gtk4 (gtk3 filter, keeps PHPUnit's extensions) + phpunit
      - name: Show versions
        run: |
          php -v | head -1
          pkg-config --modversion gtk4

      - name: Run PHPUnit
        run: ./ci.sh --only=test -- --log-junit phpunit-junit.xml --display-warnings

      - name: Upload PHPUnit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phpunit-junit-php${{ matrix.php }}-${{ matrix.ts }}
          path: phpunit-junit.xml
          if-no-files-found: ignore

      # php-src run-tests.php: the process-level assertions PHPUnit cannot make
      # (g_critical on stderr, uncaught fatals, RSHUTDOWN output, --INI--/--ENV--).
      - name: Run run-tests.php (tests/phpt)
        run: ./ci.sh --only=phpt

      - name: Upload failing phpt output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: phpt-failures-php${{ matrix.php }}-${{ matrix.ts }}
          path: |
            tests/phpt/*.out
            tests/phpt/*.diff
            tests/phpt/*.log
          if-no-files-found: ignore

  sanitizers:
    name: Valgrind / ASan / UBSan / LSan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PHP: php
      PHP_CONFIG: php-config
      PHPIZE: phpize
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, mbstring, tokenizer, xml, xmlwriter
          tools: composer
          coverage: none

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libgtk-4-dev xvfb libxtst6 build-essential valgrind

      - name: Install PHPUnit
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Build extension (phpize)
        run: ./ci.sh --only=build

      - name: Run valgrind stage
        run: ./ci.sh --only=valgrind

      # Instrumented gtk4-asan.so: stress script with LeakSanitizer (only our
      # module in that process), then the PHPUnit suite for memory errors.
      - name: Run sanitizer stage
        run: ./ci.sh --only=asan

  coverage:
    name: C++ line coverage (gcov)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PHP: php
      PHP_CONFIG: php-config
      PHPIZE: phpize
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, mbstring, tokenizer, xml, xmlwriter
          tools: composer
          coverage: none

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libgtk-4-dev xvfb libxtst6 build-essential gcovr

      - name: Install PHPUnit
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run coverage stage
        run: ./ci.sh --only=coverage

      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v7
        with:
          name: cpp-coverage
          path: coverage/
          if-no-files-found: ignore

  # --enable-gtk4-webkit is analysed by cpp-lint.yml; this leg makes sure it also compiles,
  # links and loads (no WebKit tests yet - docs/PLAN.md milestone 6).
  webkit-build:
    name: WebKitGTK build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PHP: php
      PHP_CONFIG: php-config
      PHPIZE: phpize
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: none

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libgtk-4-dev libwebkitgtk-6.0-dev build-essential

      - name: Build and load with WebKit
        run: GTK4_CONFIGURE_ARGS=--enable-gtk4-webkit ./ci.sh --only=build,load
