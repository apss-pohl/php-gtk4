name: Windows build (reusable)

# The one Windows recipe - php_gtk4.dll with the PHP SDK (phpize.bat + configure + nmake,
# config.w32) against gvsbuild's prebuilt MSVC GTK 4 - called by windows.yml (every PR, with
# the PHPUnit suite on the runner's desktop) and by release.yml (named, version-checked
# release asset). GVSBUILD_VERSION is pinned here only; docs/BUILD.md "The pinned GTK version".

on:
  workflow_call:
    inputs:
      php:
        description: PHP version (setup-php)
        required: true
        type: string
      ts:
        description: nts or ts
        required: false
        type: string
        default: nts
      phpunit-args:
        description: extra PHPUnit arguments (temporary bisect of the VfuncTest crash)
        required: false
        type: string
        default: ''
      run-tests:
        description: run the PHPUnit suite against the built dll
        required: false
        type: boolean
        default: false
      artifact:
        description: name of the uploaded dll artifact
        required: true
        type: string
      dll-name:
        description: file name for the dll in the artifact (default php_gtk4.dll)
        required: false
        type: string
        default: php_gtk4.dll
      expect-version:
        description: phpversion("gtk4") the dll must report (default VERSION file)
        required: false
        type: string
        default: ''

env:
  # https://github.com/wingtk/gvsbuild/releases - prebuilt GTK4_Gvsbuild_<ver>_x64.zip.
  # Bump here (the cache key follows); the asset is ~300 MB so it is cached per version.
  GVSBUILD_VERSION: '2026.8.0'
  # The archive every Windows binary is linked against, pinned by content: a release asset is
  # mutable by its owner, and this one is cached, so without the hash a replaced upload would be
  # picked up once and reused for every later build. Bump it with the version (docs/BUILD.md):
  #   curl -s https://api.github.com/repos/wingtk/gvsbuild/releases/tags/<ver> \
  #     | jq -r '.assets[] | select(.name | test("GTK4")) | .digest'
  GVSBUILD_SHA256: '1f95a92d037f5292da05e6ab1037032ff21ddb7b20d4ac8e83e3674c864c07b0'
  GTK4_ROOT: C:\gtk
  # php-src's Windows SDK (phpsdk-vs17-x64.bat, nmake wrappers, deps handling).
  PHP_SDK_REF: php-sdk-2.8.3  # a tag, never a branch: this shell builds what release.yml attests
  PHP_SDK_VS: vs17

jobs:
  build:
    name: PHP ${{ inputs.php }} (${{ inputs.ts }})
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      phpts: ${{ inputs.ts }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP ${{ inputs.php }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ inputs.php }}
          extensions: dom, mbstring, tokenizer, xml, xmlwriter
          tools: composer
          coverage: none

      # The devel pack matching the exact php.exe setup-php installed: headers, php8.lib,
      # phpize.bat and the configure scripts. releases.json lists the current one per branch.
      - name: PHP devel pack
        id: devel
        run: |
          $ver = php -r 'echo PHP_VERSION;'
          $ts = if ('${{ inputs.ts }}' -eq 'ts') { '' } else { '-nts' }
          $zip = "php-devel-pack-$ver$ts-Win32-$env:PHP_SDK_VS-x64.zip"
          $urls = @("https://downloads.php.net/~windows/releases/$zip",
                    "https://downloads.php.net/~windows/releases/archives/$zip",
                    "https://downloads.php.net/~windows/qa/$zip")
          $ok = $false
          foreach ($u in $urls) {
            try { Invoke-WebRequest -Uri $u -OutFile $zip -ErrorAction Stop; $ok = $true; break } catch { Write-Host "not at $u" }
          }
          if (-not $ok) { throw "no devel pack for PHP $ver ($zip)" }
          Expand-Archive $zip -DestinationPath C:\php-devel
          $dir = (Get-ChildItem C:\php-devel -Directory | Select-Object -First 1).FullName
          "dir=$dir" >> $env:GITHUB_OUTPUT
          Write-Host "devel pack: $dir"
          php -v

      - name: PHP SDK binary tools
        run: git clone --depth 1 --branch $env:PHP_SDK_REF https://github.com/php/php-sdk-binary-tools C:\php-sdk

      # The hash is part of the key: bumping the pin can never resolve to the old tree.
      - name: Cache gvsbuild GTK 4
        id: gtk-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:\gtk
          key: gvsbuild-gtk4-${{ env.GVSBUILD_VERSION }}-${{ env.GVSBUILD_SHA256 }}-x64

      - name: Download gvsbuild GTK 4 ${{ env.GVSBUILD_VERSION }}
        if: steps.gtk-cache.outputs.cache-hit != 'true'
        run: |
          $zip = "GTK4_Gvsbuild_$env:GVSBUILD_VERSION`_x64.zip"
          Invoke-WebRequest -Uri "https://github.com/wingtk/gvsbuild/releases/download/$env:GVSBUILD_VERSION/$zip" -OutFile $zip
          # Everything below - and every php_gtk4.dll this repository publishes - trusts this
          # archive. Verify it before it is unpacked, not after.
          $got = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $env:GVSBUILD_SHA256) {
            throw "gvsbuild archive hash mismatch: got $got, GVSBUILD_SHA256 says $env:GVSBUILD_SHA256"
          }
          Write-Host "gvsbuild archive verified: $got"
          Expand-Archive $zip -DestinationPath C:\gtk
          # The asset may carry one wrapping directory; config.w32 wants <root>\include\gtk-4.0.
          if (-not (Test-Path C:\gtk\include\gtk-4.0)) {
            $inner = Get-ChildItem C:\gtk -Directory | Where-Object { Test-Path "$($_.FullName)\include\gtk-4.0" } | Select-Object -First 1
            if (-not $inner) { throw 'unexpected gvsbuild zip layout' }
            Get-ChildItem $inner.FullName | Move-Item -Destination C:\gtk
            Remove-Item $inner.FullName -Recurse
          }
          Set-Content -Path C:\gtk\.gvsbuild-sha256 -Value $env:GVSBUILD_SHA256 -NoNewline
          Get-ChildItem C:\gtk

      # A cache entry is not the archive: an Actions cache can be written by other workflow runs
      # in this repository, so the restored tree has to say which archive it came from.
      - name: Verify the restored gvsbuild cache
        if: steps.gtk-cache.outputs.cache-hit == 'true'
        run: |
          $stamp = 'C:\gtk\.gvsbuild-sha256'
          if (-not (Test-Path $stamp)) { throw "restored gvsbuild cache has no $stamp - refusing it" }
          $got = (Get-Content $stamp -Raw).Trim()
          if ($got -ne $env:GVSBUILD_SHA256) {
            throw "restored gvsbuild cache says $got, GVSBUILD_SHA256 says $env:GVSBUILD_SHA256"
          }
          Write-Host "gvsbuild cache verified: $got"

      # phpize.bat (devel pack) -> configure.js from config.w32 -> configure -> nmake, inside the
      # SDK shell so cl/link/nmake for the VS series PHP was built with are on PATH. The build
      # log is kept: a compiler warning in src\ fails the job (config.w32 sets /W3; the
      # counterpart of ci.sh's warning gate, without /WX so system headers cannot break it).
      - name: Build php_gtk4.dll
        shell: cmd
        run: |
          set "PATH=${{ steps.devel.outputs.dir }};%PATH%"
          echo phpize ^&^& configure --with-gtk4=%GTK4_ROOT% ^&^& nmake > build-task.bat
          call C:\php-sdk\phpsdk-${{ env.PHP_SDK_VS }}-x64.bat -t build-task.bat > build.log 2>&1
          set RC=%ERRORLEVEL%
          type build.log
          if not "%RC%"=="0" exit /b %RC%
          dir /s /b x64\*.dll

      - name: No compiler warnings in src
        run: |
          $hits = Select-String -Path build.log -Pattern '\\src\\.*warning C\d+' -CaseSensitive:$false
          if ($hits) { $hits | ForEach-Object { Write-Host $_.Line }; throw 'compiler warnings in src\ (see above)' }

      - name: Extension loads and reports the right version
        run: |
          $dll = (Get-ChildItem -Recurse x64 -Filter php_gtk4.dll | Select-Object -First 1).FullName
          "GTK4_DLL=$dll" >> $env:GITHUB_ENV
          $env:PATH = "$env:GTK4_ROOT\bin;$env:PATH"
          $want = '${{ inputs.expect-version }}'
          if ($want -eq '') { $want = (Get-Content VERSION -Raw).Trim() }
          $got = php -n -dextension="$dll" -r 'echo phpversion("gtk4");'
          if ($LASTEXITCODE -ne 0) { throw 'php_gtk4.dll did not load' }
          if ($got -ne $want) { throw "php_gtk4.dll reports '$got', expected '$want'" }
          php -n -dextension="$dll" -r 'echo Gtk4\BUILD_INFO, " ", Gtk4\FEATURES, "\n";'
          "${{ inputs.dll-name }} -> $got (GTK from gvsbuild $env:GVSBUILD_VERSION)" >> $env:GITHUB_STEP_SUMMARY

      - name: Cache Composer packages
        if: inputs.run-tests
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: composer-win-php${{ inputs.php }}-${{ hashFiles('composer.lock') }}

      - name: Install PHPUnit
        if: inputs.run-tests
        run: composer install --no-interaction --no-progress --prefer-dist

      # The runner session has a desktop, which is all GDK's win32 backend needs.
      # --log-events-text is written as the run goes: a GTK assertion ends the process with
      # 0xC0000409 and PHPUnit writes no JUnit file, so this is what names the test that was
      # running (tests.yml does the same for the Linux jobs).
      - name: Run PHPUnit
        if: inputs.run-tests
        shell: cmd
        run: tests\run.cmd --log-junit phpunit-junit.xml --log-events-text phpunit-events.txt --display-warnings ${{ inputs.phpunit-args }}

      - name: Name the last test on a crash
        if: inputs.run-tests && failure()
        shell: pwsh
        run: Get-Content phpunit-events.txt -Tail 20 -ErrorAction SilentlyContinue

      - name: Upload PHPUnit report
        if: inputs.run-tests && always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phpunit-junit-windows-php${{ inputs.php }}-${{ inputs.ts }}
          path: |
            phpunit-junit.xml
            phpunit-events.txt
          if-no-files-found: ignore

      - name: Stage the dll under its artifact name
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item $env:GTK4_DLL "dist\${{ inputs.dll-name }}"

      - name: Upload php_gtk4.dll
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact }}
          path: dist/${{ inputs.dll-name }}
          if-no-files-found: error
          retention-days: 7
