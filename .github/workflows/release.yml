name: Release

# ./VERSION is the gate (docs/RELEASING.md):
#   0.2.0-dev  -> publish the dev build v0.2.0-dev.<run> as a pre-release
#   0.2.0      -> publish the real release v0.2.0 (once; later merges are a no-op)
# Both attach the .so (Linux) and php_gtk4.dll (Windows) built here for every
# supported PHP, plus a source tarball and SHA256SUMS, with build provenance instead of a signed tag. Pre-releases are
# immutable; the newest 5 are kept and older ones are deleted after each publish.
# A real release also pushes stubs/ to the Composer package repository (STUBS_REPO)
# and tags it with the same version, so `composer require --dev php-gtk4/stubs`
# tracks the extension release for release.

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: read

env:
  # ci.sh, bin/php-gtk4 and tests/run.sh default to the php8.4 binaries; setup-php provides plain names.
  PHP: php
  PHP_CONFIG: php-config
  PHPIZE: phpize
  # ubuntu-24.04 is the GTK 4.14 floor: binaries built here run on newer distros, not older ones.
  DIST: ubuntu24.04
  # How many pre-releases stay downloadable. Older ones are deleted with their tags.
  KEEP_PRERELEASES: '5'
  # Where the stubs package lives (Packagist reads its tags). Pushed with the
  # STUBS_DEPLOY_KEY secret, a write deploy key of that repository; without the
  # secret the job reports what it would have done and does nothing.
  STUBS_REPO: apss-pohl/php-gtk4-stubs

jobs:
  # What the release is called and whether it is real. Runs before anything
  # expensive so a malformed ./VERSION fails in seconds.
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.plan.outputs.version }}      # what the binary reports, from ./VERSION
      relver: ${{ steps.plan.outputs.relver }}        # what this release is called (dev builds add .<run>)
      kind: ${{ steps.plan.outputs.kind }}
      tag: ${{ steps.plan.outputs.tag }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(tr -d ' \t\r\n' < VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-dev)?$ ]] \
            || { echo "::error file=VERSION::must be X.Y.Z or X.Y.Z-dev, got '$version'"; exit 1; }

          if [[ "$version" == *-dev ]]; then
            # github.run_number is monotonic per workflow, so 0.2.0-dev.7 < 0.2.0-dev.11
            # < 0.2.0 under SemVer prerelease ordering. Gaps are fine; collisions are not.
            kind=dev; relver="$version.${{ github.run_number }}"; tag="v$relver"; publish=true
          else
            kind=release; relver="$version"; tag="v$version"
            # A real release is published exactly once; every merge after it,
            # until someone bumps ./VERSION back to -dev, has nothing to do.
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              publish=false
              echo "::notice::$tag is already released - nothing to publish"
            else
              publish=true
            fi
          fi
          printf '%s\n' "version=$version" "relver=$relver" "kind=$kind" "tag=$tag" "publish=$publish" \
            >> "$GITHUB_OUTPUT"
          echo "$kind $tag (publish=$publish)" >> "$GITHUB_STEP_SUMMARY"

  # The gate. Deliberately re-runs what tests.yml ran on the PR: a release job
  # that depends on a separate workflow's result races with it, and a broken
  # pre-release is worse than a slow one.
  verify:
    name: Verify PHP ${{ matrix.php }}${{ matrix.ts == 'ts' && ' ZTS' || '' }}
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        # A dev build is validated the way a pull request is; a real release is also validated
        # against the thread model it claims to support, which nothing else on main does.
        ts: ${{ needs.plan.outputs.kind == 'release' && fromJSON('["nts","ts"]') || fromJSON('["nts"]') }}
    env:
      phpts: ${{ matrix.ts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, mbstring, tokenizer, xml, xmlwriter
          tools: composer
          coverage: none
          # setup-php defaults to the production php.ini, where register_argc_argv is Off:
          # PHPStan then reports "$argv might not be defined" in every CLI entry script
          # (gen/gir.php, gen/ide-stub.php, examples/demo.php, ...) and php-qa fails on the
          # runner while passing locally. ci.sh runs these scripts from the CLI, where argv
          # is there - say so (WorkflowsTest pins it).
          ini-values: register_argc_argv=On

      # clang 20 from apt.llvm.org: the same clang-tidy/clang-format the C++ lint
      # workflow and the local defaults use, so the release gate cannot pass or fail
      # on findings that differ between clang versions.
      - name: Install build deps and clang 20
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /usr/share/keyrings/apt.llvm.org.asc >/dev/null
          echo "deb [signed-by=/usr/share/keyrings/apt.llvm.org.asc] http://apt.llvm.org/noble/ llvm-toolchain-noble-20 main" | sudo tee /etc/apt/sources.list.d/llvm-20.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgtk-4-dev gir1.2-gtk-4.0 libwebkitgtk-6.0-dev xvfb libxtst6 build-essential \
            clang-tidy-20 clang-format-20

      - name: Install PHPUnit
        run: composer install --no-interaction --no-progress --prefer-dist

      # version + gen + stubs + build + load + test + phpt. The version stage and
      # config.m4 both assert ./VERSION == src/php_gtk4.h, and the load stage
      # asserts the built .so reports it too.
      #
      # Without cpp-lint: clang-tidy does not depend on the PHP version, so this matrix ran it
      # twice per merge, each time from a cold cache (30+ minutes since the WebKit namespaces
      # arrived - past this job's own timeout). cpp-lint.yml runs on main and is the gate for it.
      - name: Full CI gate
        env:
          CLANG_TIDY: clang-tidy-20
          CLANG_FORMAT: clang-format-20
        run: ./ci.sh --skip=cpp-lint

  # One .so per supported PHP. Named with the whole ABI identity: a gtk4.so is
  # bound to ZEND_MODULE_API, NTS/ZTS, the C++ ABI, glibc and the GTK soname,
  # so an unlabelled asset only produces bug reports from mismatched installs.
  build:
    name: Build .so (PHP ${{ matrix.php }})
    needs: [plan, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libgtk-4-dev build-essential

      - name: Build extension
        run: ./ci.sh --only=build

      - name: Name and verify the artifact
        run: |
          set -euo pipefail
          version="${{ needs.plan.outputs.version }}"   # what the binary reports
          relver="${{ needs.plan.outputs.relver }}"     # what this release is called
          arch=$(gcc -dumpmachine)                      # x86_64-linux-gnu
          name="gtk4-$relver-php${{ matrix.php }}-nts-$arch-$DIST.so"
          mkdir -p dist && cp gtk4.so "dist/$name"
          # Last line of defence: the file we are about to publish must report the
          # version in ./VERSION. On a dev build the filename carries a .<run> suffix
          # the binary does not - two dev builds are different files and must not
          # share a name in someone's downloads folder. PHPGTK_BUILD_INFO (git hash)
          # identifies the exact commit from inside the module.
          got=$(php -n -dextension="$PWD/dist/$name" -r 'echo phpversion("gtk4");')
          [[ "$got" == "$version" ]] || { echo "::error::$name reports $got, expected $version"; exit 1; }
          echo "$name -> $got" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: so-php${{ matrix.php }}
          path: dist/*.so
          if-no-files-found: error
          retention-days: 7

  # One php_gtk4.dll per supported PHP and thread model: the Windows counterpart of
  # `build`, same recipe as windows.yml (PHP SDK + config.w32 against gvsbuild's MSVC
  # GTK 4). PIE never builds on Windows - it downloads one of these - so both thread
  # models ship, and the name is the one PIE looks for:
  # php_<extension>-<version>-<php>-<ts|nts>-<compiler>-<arch>, lower case throughout
  # (php/pie, Platform/WindowsExtensionAssetName). The zip around it is made in `publish`.
  build-windows:
    name: Build .dll (PHP ${{ matrix.php }} ${{ matrix.ts }})
    needs: [plan, verify]
    # Real releases only. These are what PIE installs on Windows, and PIE resolves a release,
    # never a dev pre-release - so four Windows jobs per merge built assets nobody could
    # install. windows.yml is what says whether Windows still builds at all.
    if: needs.plan.outputs.kind == 'release'
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        ts: [nts, ts]
    uses: ./.github/workflows/windows-build.yml
    with:
      php: ${{ matrix.php }}
      ts: ${{ matrix.ts }}
      artifact: dll-php${{ matrix.php }}-${{ matrix.ts }}
      dll-name: php_gtk4-${{ needs.plan.outputs.relver }}-${{ matrix.php }}-${{ matrix.ts }}-vs17-x86_64.dll
      expect-version: ${{ needs.plan.outputs.version }}
      # The binaries a release ships run the suite first: windows.yml only sees the pull
      # requests that touch what it depends on, so this is what covers the shipped dll.
      run-tests: true

  # gcov on every merge: the floor (COVERAGE_MIN_LINES) is what matters, and once per merge is
  # soon enough to act on while still being direct.
  coverage:
    name: C++ line coverage (gcov)
    needs: [plan, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PHP: php
      PHP_CONFIG: php-config
      PHPIZE: phpize
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: dom, mbstring, tokenizer, xml, xmlwriter
          tools: composer
          coverage: none
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgtk-4-dev xvfb libxtst6 build-essential gcovr
      - name: Install PHPUnit
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Run coverage stage
        run: ./ci.sh --only=coverage
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cpp-coverage
          path: coverage/
          if-no-files-found: ignore

  # What "Cutting a release" tells the maintainer to run locally before opening the release PR
  # (docs/RELEASING.md), run here instead so that forgetting it cannot ship anything. Real
  # releases only: these are minutes, and a dev build is not what anybody installs.
  release-gate:
    name: Sanitizers and valgrind
    needs: [plan, verify]
    if: needs.plan.outputs.kind == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PHP: php
      PHP_CONFIG: php-config
      PHPIZE: phpize
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: dom, mbstring, tokenizer, xml, xmlwriter
          tools: composer
          coverage: none
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgtk-4-dev xvfb libxtst6 build-essential valgrind
      - name: Install PHPUnit
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Build extension (phpize)
        run: ./ci.sh --only=build
      - name: Run valgrind stage
        run: ./ci.sh --only=valgrind
      - name: Run sanitizer stage
        run: ./ci.sh --only=asan

  publish:
    name: Publish ${{ needs.plan.outputs.tag }}
    needs: [plan, verify, build, build-windows, coverage, release-gate]
    # build-windows and release-gate are skipped for a dev build, and a skipped dependency would
    # take this job with it - so the conditions are spelled out rather than inherited.
    if: |
      always()
      && needs.verify.result == 'success'
      && needs.build.result == 'success'
      && needs.coverage.result == 'success'
      && (needs.build-windows.result == 'success' || needs.build-windows.result == 'skipped')
      && (needs.release-gate.result == 'success' || needs.release-gate.result == 'skipped')
    runs-on: ubuntu-24.04
    permissions:
      contents: write       # create/delete the tag and the release
      id-token: write       # provenance
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: '{so,dll}-php*'
          path: dist
          merge-multiple: true

      # PIE installs a Windows extension from a zip named exactly like the dll it holds,
      # with the dll at the archive root (php/pie, Platform/WindowsExtensionAssetName and
      # Installing/WindowsInstall). The bare dll is not published: the zip is what both PIE
      # and a person downloading by hand should take.
      - name: Zip the Windows builds the way PIE looks for them
        run: |
          set -euo pipefail
          cd dist
          shopt -s nullglob            # a dev build has no Windows dlls to wrap
          for dll in php_gtk4-*.dll; do
            zip -qj "${dll%.dll}.zip" "$dll"
            rm -- "$dll"
          done
          ls -l

      # The source dist is the supported install path (phpize layout); the .so
      # files are a convenience for whoever matches the ABI above.
      - name: Source tarball + checksums
        run: |
          set -euo pipefail
          relver="${{ needs.plan.outputs.relver }}"
          git archive --format=tar.gz --prefix="php-gtk4-$relver/" \
            -o "dist/php-gtk4-$relver.tar.gz" HEAD
          (cd dist && sha256sum -- * > SHA256SUMS)
          ls -l dist

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.so
            dist/*.zip

      - name: Release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${{ needs.plan.outputs.version }}"
          {
            if [[ "${{ needs.plan.outputs.kind }}" == dev ]]; then
              cat <<EOF
          **Development build of $version, not a release.** Built from
          [\`${GITHUB_SHA:0:7}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}).
          The module itself reports \`$version\` - the \`.$GITHUB_RUN_NUMBER\` in the tag and the
          filenames distinguishes builds of it. Only the newest $KEEP_PRERELEASES dev builds are
          kept; this one is deleted once $KEEP_PRERELEASES newer merges land.

          Linux only: the Windows builds are made for real releases, which is what \`pie install\`
          resolves.

          EOF
            else
              # The one thing that cannot be reconstructed from git: fail loudly if absent.
              awk -v pfx="## [$version]" '
                index($0, pfx) == 1 { p = 1; next }
                p && /^## / { exit }
                p { print }
              ' CHANGELOG.md > .notes-body
              [[ -s .notes-body ]] || { echo "::error file=CHANGELOG.md::no '## [$version]' section"; exit 1; }
              cat .notes-body
            fi

            # The commit messages, grouped by Conventional Commit type. They are the
            # detail behind the prose above and the whole body of a dev build's notes
            # (docs/RELEASING.md "What a release body says"). --stable measures a real
            # release from the previous real release, skipping the v*-dev.* tags between.
            printf '\n'
            if [[ "${{ needs.plan.outputs.kind }}" == dev ]]; then
              ./bin/release-notes
            else
              ./bin/release-notes --stable
            fi
            printf '\n'

            cat <<'EOF'

          ### Install

          ```sh
          pie install php-gtk4/php-gtk4              # the extension
          composer require --dev php-gtk4/stubs     # IDE and PHPStan stubs
          ```

          [PIE](https://github.com/php/pie) builds from source on Linux, so the GTK 4 development
          headers have to be there first (`libgtk-4-dev`, 4.14 or newer; add
          `libwebkitgtk-6.0-dev` and `--enable-gtk4-webkit` for the WebKit classes). On Windows it
          takes one of the `php_gtk4-*.zip` files below - no build tools needed.

          Or by hand: `php-gtk4-*.tar.gz` is the same source in the standard phpize layout.

          ```sh
          phpize && ./configure && make && sudo make install
          ```

          The prebuilt `.so` files are a convenience and are **not portable**. Each is bound to the
          PHP version, NTS (ZTS builds from source), the C++ ABI, glibc and the GTK 4
          soname in its filename; built on Ubuntu 24.04 (GTK 4.14, the supported floor), so they run
          on that and newer, not older. Anything else: build from source.

          The `php_gtk4-*.zip` files are the Windows builds - PHP version, thread model, VS17 and
          x86_64 in the name, each holding the matching `.dll`. They are compiled against gvsbuild's
          MSVC GTK 4 and need the `bin\` directory of a gvsbuild GTK 4 tree on `PATH`
          (docs/BUILD.md "Windows"); PIE unpacks one for you.

          Verify with `sha256sum -c SHA256SUMS`, and `gh attestation verify <file> --repo OWNER/REPO`
          for build provenance.
          EOF
          } > NOTES.md

      # Pre-releases are immutable: one tag per merge, never moved. Retention is
      # the next step's job.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ needs.plan.outputs.tag }}"
          relver="${{ needs.plan.outputs.relver }}"

          if [[ "${{ needs.plan.outputs.kind }}" == dev ]]; then
            gh release create "$tag" dist/* \
              --title "Development build $relver" \
              --notes-file NOTES.md \
              --target "$GITHUB_SHA" \
              --prerelease --latest=false
          else
            gh release create "$tag" dist/* \
              --title "$relver" \
              --notes-file NOTES.md \
              --target "$GITHUB_SHA" \
              --latest
          fi
          echo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$tag" >> "$GITHUB_STEP_SUMMARY"

      # Keep the newest KEEP_PRERELEASES pre-releases downloadable and delete the
      # rest, tags included. Runs after both kinds of publish: a real release does
      # not wipe the dev builds, it just becomes one more thing newer than them,
      # so there are always KEEP_PRERELEASES dev builds to fall back to. Deleting
      # a release does not touch anything that already downloaded it.
      - name: Prune old pre-releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          stale=$(gh release list --limit 100 \
                    --json tagName,isPrerelease,createdAt \
                    --jq "[.[] | select(.isPrerelease)]
                          | sort_by(.createdAt) | reverse
                          | .[${KEEP_PRERELEASES}:] | .[].tagName")
          if [[ -z "$stale" ]]; then
            echo "nothing to prune (<= $KEEP_PRERELEASES pre-releases)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue
            echo "pruning $tag"
            gh release delete "$tag" --cleanup-tag --yes
            echo "pruned \`$tag\`" >> "$GITHUB_STEP_SUMMARY"
          done <<< "$stale"

  # The stubs package: stubs/ as it is at this commit, committed to STUBS_REPO and tagged
  # with the release version. Real releases only - Composer has no notion of the
  # `-dev.<run>` suffix, and an IDE does not need a stub per merge. Idempotent: a tag
  # that already exists there is left alone.
  publish-stubs:
    name: Publish stubs ${{ needs.plan.outputs.tag }}
    needs: [plan, publish]
    if: needs.plan.outputs.kind == 'release'
    runs-on: ubuntu-24.04
    env:
      # The secrets context is not readable in a job-level `if`; an env var is.
      HAS_DEPLOY_KEY: ${{ secrets.STUBS_DEPLOY_KEY != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: No deploy key
        if: env.HAS_DEPLOY_KEY != 'true'
        run: |
          echo "::warning::STUBS_DEPLOY_KEY is not set - stubs/ was not pushed to $STUBS_REPO" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HAS_DEPLOY_KEY == 'true'
        with:
          repository: ${{ env.STUBS_REPO }}
          ssh-key: ${{ secrets.STUBS_DEPLOY_KEY }}
          path: stubs-repo

      - name: Commit, tag and push
        if: env.HAS_DEPLOY_KEY == 'true'
        run: |
          set -euo pipefail
          tag="${{ needs.plan.outputs.tag }}"
          version="${{ needs.plan.outputs.version }}"
          cd stubs-repo
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::notice::$STUBS_REPO already has $tag - nothing to publish"
            exit 0
          fi
          # The package is stubs/ verbatim plus the licence; anything else that was
          # in the repository before (an old file) goes.
          git rm -rq --ignore-unmatch .
          cp ../stubs/gtk4.php ../stubs/composer.json ../stubs/extension.neon ../stubs/README.md .
          cp ../LICENSE LICENSE
          # The docblocks in gtk4.php are GTK's own documentation, so the notices travel with them.
          cp ../THIRD-PARTY-NOTICES.md THIRD-PARTY-NOTICES.md
          mkdir -p LICENSES && cp ../LICENSES/PHP-3.01.txt LICENSES/PHP-3.01.txt
          git add -A
          git -c user.name=github-actions -c user.email=github-actions@github.com \
            commit -q -m "php-gtk4 $version" \
            -m "stubs/ of $GITHUB_REPOSITORY at $GITHUB_SHA, generated by gen/ide-stub.php."
          git tag "$tag"
          git push origin HEAD:main "$tag"
          echo "pushed $tag to $STUBS_REPO" >> "$GITHUB_STEP_SUMMARY"
