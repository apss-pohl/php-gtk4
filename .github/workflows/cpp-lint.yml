name: C++ lint

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  cpp-static-analysis:
    name: C++ static analysis
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Dev headers needed to compile (not link) every source file. `bear`
      # records the compiler invocations into compile_commands.json.
      # ubuntu-latest ships PHP 8.3; the project is PHP 8.4+ only.
      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: none

      - name: Install GTK4 / WebKitGTK dev headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libwebkitgtk-6.0-dev bear

      # phpize build under bear -> compile_commands.json with the real include
      # paths, so clang-tidy sees GTK/PHP headers exactly as the compiler does.
      # Nothing is linked into a PHP here; this is analysis only.
      - name: Generate compile_commands.json
        env:
          PHP_CONFIG: php-config
          PHPIZE: phpize
        run: |
          phpize && ./configure --with-php-config="$(command -v php-config)" --enable-gtk4-webkit
          bear -- make -j"$(nproc)"

      - name: Generated stubs are up to date
        run: composer install --no-interaction --no-progress --prefer-dist && ./ci.sh --only=stubs

      - name: Fail on findings
        if: steps.linter.outputs.checks-failed > 0
        run: exit 1
