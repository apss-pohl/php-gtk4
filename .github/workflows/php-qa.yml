name: PHP QA

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

# Read-only token: these workflows only check out and build.
permissions:
  contents: read

# Superseded runs of the same ref are cancelled (a PR push while the previous one runs).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Conventional Commits are mandatory (docs/CONTRIBUTING.md): they are what
  # bin/release-notes turns into the body of every release. Both halves matter here -
  # main takes squash *and* rebase merges, so the PR title becomes the commit for one
  # and every commit on the branch survives the other.
  commits:
    name: Commit messages (Conventional Commits)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0        # bin/commit-lint walks the range, not just the tip

      - name: Check the PR title (a squash merge makes it the commit message)
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: ./bin/commit-lint --text "$TITLE"

      - name: Check every commit on the branch (a rebase merge keeps them all)
        env:
          COMMIT_LINT_RANGE: >-
            ${{ github.event_name == 'pull_request'
                && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha)
                || format('{0}..{1}', github.event.before, github.sha) }}
        run: |
          # A brand-new branch reports an all-zero "before"; there is nothing to diff
          # against then, so fall back to the tip commit alone.
          if [[ "$COMMIT_LINT_RANGE" == 0000000000000000000000000000000000000000..* ]]; then
            COMMIT_LINT_RANGE="HEAD~1..HEAD"
          fi
          COMMIT_LINT_RANGE="$COMMIT_LINT_RANGE" ./ci.sh --only=commits

  php-qa:
    name: PHP QA (phplint, phpcs, php-cs-fixer, phpstan, markdownlint)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PHP: php
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}

      - name: Install tools
        run: composer install --no-interaction --no-progress --prefer-dist

      # No extension needed: PHPStan sees Gtk4\ classes via stubs/gtk4.php.
      # Every tool uses all cores (JOBS defaults to nproc).
      - name: Run PHP QA
        run: ./ci.sh --only=php-qa

      # Docs lint shares this workflow (and its badge): no extension, no GTK, seconds to run.
      # The runner has node, so the stage's npx fallback resolves markdownlint-cli2.
      - name: Run markdown lint
        run: ./ci.sh --only=md-lint
