name: PHP QA

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  php-qa:
    name: PHP QA (phplint, phpcs, php-cs-fixer, phpstan, markdownlint)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PHP: php
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}

      - name: Install tools
        run: composer install --no-interaction --no-progress --prefer-dist

      # No extension needed: PHPStan sees Gtk4\ classes via stubs/gtk4.php.
      # Every tool uses all cores (JOBS defaults to nproc).
      - name: Run PHP QA
        run: ./ci.sh --only=php-qa

      # Docs lint shares this workflow (and its badge): no extension, no GTK, seconds to run.
      # The runner has node, so the stage's npx fallback resolves markdownlint-cli2.
      - name: Run markdown lint
        run: ./ci.sh --only=md-lint
