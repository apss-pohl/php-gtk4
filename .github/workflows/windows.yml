name: Windows build

# The Windows counterpart of tests.yml: php_gtk4.dll built with the PHP SDK against gvsbuild's
# MSVC GTK 4, loaded, then the PHPUnit suite on the runner's desktop - the recipe lives in
# windows-build.yml (shared with release.yml). tests/phpt is Linux-only (run-tests.php + Xvfb);
# see docs/BUILD.md "Windows".

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Superseded runs of the same ref are cancelled (a PR push while the previous one runs).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows PHP ${{ matrix.php }} (${{ matrix.ts }})
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        # Both thread models, like tests.yml. setup-php reads phpts; the devel pack drops its
        # -nts suffix; output lands in Release_TS.
        ts: [nts, ts]
    uses: ./.github/workflows/windows-build.yml
    with:
      php: ${{ matrix.php }}
      ts: ${{ matrix.ts }}
      run-tests: true
      artifact: php_gtk4-php${{ matrix.php }}-${{ matrix.ts }}-vs17-x64
